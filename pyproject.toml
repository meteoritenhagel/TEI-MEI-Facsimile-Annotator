[project]
name = "tei-mei-facsimile-annotator"
version = "0.1.0"
description = "Initial PySide6 scaffold for TEI/MEI facsimile zone annotation."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
